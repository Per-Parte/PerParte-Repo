<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f5ee">
    <meta name="description" content="Encontre a sua luz na Per Parte. Explore luminárias, cores e composições.">
    <title>Loja — Per Parte</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/fonts.css">
    <link rel="stylesheet" href="/comercio.css">
    <link rel="stylesheet" href="/paleta.css">
    <link rel="stylesheet" href="/navegacao.css">
    <script type="module" src="/comercio.js"></script>
  </head>
  <body>
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>
    <div data-navegacao-compartilhada>
      <nav class="nav-sem-script" aria-label="Principal"><a href="/">Per Parte</a><a href="/loja">Loja</a><a href="/conta">Minha conta</a><a href="/carrinho">Sacola</a></nav>
    </div>
    <main id="conteudo" tabindex="-1"><div class="carregamento" role="status">Encontrando a sua luz…</div></main>
    <footer class="rodape">
      <div><p>Criado por você,<br>feito por partes.</p><a href="/loja">Explore a coleção</a></div>
      <nav aria-label="Rodapé"><a href="/">Início</a><a href="/loja">Loja</a><a href="/conta">Minha conta</a><a href="/carrinho">Sacola</a></nav>
      <a class="marca-rodape" href="/">Per Parte</a>
      <small>Per Parte · A era do criar.</small>
    </footer>
    <dialog id="busca-dialogo" class="busca-dialogo" aria-labelledby="busca-titulo">
      <button class="icone fechar-dialogo" type="button" data-fechar aria-label="Fechar busca"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
      <h2 id="busca-titulo">Qual é a sua luz?</h2>
      <form action="/loja" method="get"><label for="busca-termo">Busque por nome, cor ou composição</label><div class="campo-busca"><input id="busca-termo" name="q" type="search" autocomplete="off" placeholder="Buscar luminárias"><button class="botao" type="submit">Buscar</button></div></form>
    </dialog>
    <dialog id="zoom-dialogo" class="zoom-dialogo" aria-label="Imagem ampliada da luminária">
      <button class="icone fechar-dialogo" type="button" data-fechar aria-label="Fechar imagem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
      <img id="zoom-imagem" alt="">
    </dialog>
    <div class="mensagem-flutuante" role="status" aria-live="polite" hidden></div>
    <noscript><p class="sem-script">Ative o JavaScript para explorar as cores e consultar o catálogo da loja.</p></noscript>
  </body>
</html>
